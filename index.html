<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avengers Character Search</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Avengers Character Search</h1>
  </header>

  <main>
    <form id="search-form">
      <label for="query">Search by Full Name or Alias</label>
     <div class="search-row">
       <input type="text" id="query" name="query" placeholder="e.g. Captain America or Steve Rogers">
       <button id="search-btn" type="submit">Search</button>
     </div>
    </form>

    <h2>Result</h2>
    <div id="result"></div>
  </main>
</body>
</html>
